<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Open the deployed NoteHub application on Vercel."
    />
    <title>NoteHub</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        color: #212529;
        background: #f8f9fa;
      }

      main {
        width: min(100%, 560px);
        padding: 48px 32px;
        text-align: center;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 16px;
        font-size: 40px;
      }

      p {
        margin: 0 0 28px;
        color: #6c757d;
        line-height: 1.5;
      }

      a {
        display: inline-block;
        padding: 12px 20px;
        color: #ffffff;
        background: #0d6efd;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 700;
      }

      a:hover {
        background: #0b5ed7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>NoteHub</h1>
      <p>The working Next.js application is deployed on Vercel.</p>
      <a href="https://08-zustand-psi-orcin.vercel.app">
        Open NoteHub on Vercel
      </a>
    </main>
  </body>
</html>
